name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore DeepTrace.slnx

      - name: Build
        run: dotnet build DeepTrace.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test DeepTrace.slnx --no-build --configuration Release --verbosity normal
